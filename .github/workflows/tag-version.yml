name: Tag Version After Bump

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag-version
  cancel-in-progress: false

jobs:
  create-tag:
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'bump-version-')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        id: get_version
        run: |
          if [ ! -f package.json ]; then
            echo "Error: package.json not found"
            exit 1
          fi
          
          VERSION=$(node -p "require('./package.json').version" 2>&1)
          if [ $? -ne 0 ] || [ -z "$VERSION" ]; then
            echo "Error: Failed to extract version from package.json"
            exit 1
          fi
          
          # Validate version format (X.Y.Z)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format: $VERSION"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          TAG_NAME="v${{ steps.get_version.outputs.version }}"
          
          # A tag at HEAD means an earlier run pushed it and a later step failed.
          # Continue so the idempotent release step can retry.
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            TAG_SHA=$(git rev-parse "$TAG_NAME^{commit}")
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag $TAG_NAME already points at HEAD ($HEAD_SHA); skipping tag creation."
              exit 0
            fi
            echo "Error: Tag $TAG_NAME already exists at $TAG_SHA, not HEAD ($HEAD_SHA)"
            exit 1
          fi
          
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/create-release.sh "v${{ steps.get_version.outputs.version }}" "${{ github.repository }}"
