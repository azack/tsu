name: Backfill Release

# Releases are created automatically by tag-version.yml when a version bump
# merges. Run this by hand only for a tag that exists without a release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish a release for (e.g., v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: scripts/create-release.sh "$TAG" "${{ github.repository }}"
