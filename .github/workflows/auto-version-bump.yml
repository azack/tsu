name: Auto Version Bump

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Runs on push rather than pull_request so merges of fork PRs get a write
# token; a fork's pull_request run only gets a read-only GITHUB_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-version-bump
  cancel-in-progress: false

jobs:
  detect-bump-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is-bump-merge: ${{ steps.check.outputs.is-bump-merge }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - name: Check whether this push merged the bump PR
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          result=$(scripts/is-bump-pr-commit.sh "$GITHUB_SHA" "$GITHUB_REPOSITORY")
          echo "is-bump-merge=$result" >> "$GITHUB_OUTPUT"

  bump-version:
    needs: detect-bump-merge
    if: github.event_name == 'workflow_dispatch' || needs.detect-bump-merge.outputs.is-bump-merge == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump minor version
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Validate current version format (must be X.Y.Z)
          if ! [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Current version must be in X.Y.Z format"
            echo "Current version: $CURRENT_VERSION"
            exit 1
          fi

          # Split version into major.minor.patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Increment minor version and reset patch to 0
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"

          echo "New version: $NEW_VERSION"

          # Update package.json
          npm version $NEW_VERSION --no-git-tag-version

          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # One fixed branch, so each merge updates the open bump PR instead of
          # opening a competing one for the same version. tag-version.yml keys
          # on the bump-version- prefix.
          branch: bump-version-next
          base: main
          title: "chore: bump version to ${{ env.VERSION }}"
          body: |
            Automated version bump to ${{ env.VERSION }}

            This PR was automatically created after ${{ github.sha }} landed on main.
          commit-message: "chore: bump version to ${{ env.VERSION }}"
          delete-branch: true
