name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      
      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      
      - name: Type check
        run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      
      - name: Build
        run: pnpm build

  build-check:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      
      - name: Build
        run: pnpm build
      
      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code; then
            echo "Error: Build produced uncommitted changes. Please run 'pnpm build' and commit the changes."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, build-check]
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      
      - name: Run tests
        run: pnpm test:run

  coverage:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, build-check]
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      
      - name: Run tests with coverage
        run: pnpm test:coverage

  security-audit:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      
      # First check: Report all moderate+ vulnerabilities but don't fail
      - name: Run security audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true
      
      # Second check: Fail the build if high or critical vulnerabilities exist
      - name: Check for high/critical vulnerabilities
        run: pnpm audit --audit-level high
